# Builds the full debug APK of this fork (SHIELD TV 2015 support) and publishes it as a GitHub
# pre-release, with SHIELD-2015.md as the notes and the APK's SHA-256. Run by hand only.
name: release-shield

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.4.8-shield2015"

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build the full debug APK
        run: ./gradlew :app:assembleFullDebug --console=plain

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          src=$(ls app/build/outputs/apk/full/debug/*.apk | head -1)
          apk="cleanyourtv-${TAG#v}-debug.apk"
          cp "$src" "$apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          { echo "**SHA-256 \`$apk\`:** \`$sum\`"; echo; cat SHIELD-2015.md; } > notes.md
          gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --prerelease \
            --title "Clean Your TV ${TAG#v} (SHIELD TV 2015, no oficial / unofficial)" \
            --notes-file notes.md
